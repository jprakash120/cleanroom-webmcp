# Netlify: static site, no build step. Serves the repo root over HTTPS
# (WebMCP requires a secure context) with cross-origin isolation for DuckDB-WASM.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
